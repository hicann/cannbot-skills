# example-routes.yaml — 范式 → 参考实现路由表（按语言维度）
#
# 根据 op.paradigms + op.language 路由到对应语言适配层的参考实现示例代码。
# 路径相对于 ops-design-paradigms skill 根目录。
#
# 匹配规则：
#   op.paradigms 列表逐项匹配，结果自动去重；
#   每个范式条目为 {语言: [路径]} 映射，按 op.language 选择
#   （语言缺失或未知时不选择适配层）；
#   兼容旧扁平格式（范式条目直接为路径列表，视为 ascendc 专属）。
#
# 兜底机制：
#   当 op.paradigms 在本表中没有任何匹配时，返回空，不强制注入通用示例；
#   语言已注册但该语言暂无参考实现时，同样返回空并提示，
#   不回退其他语言的参考实现（语言适配层互斥）。

routes:
  paradigms:
    SortSelect:
      ascendc:
        - references/paradigms/sortselect/adapters/ascendc/example/sort
      dsl:
        - references/paradigms/sortselect/adapters/dsl/example/sort
    Broadcast:
      ascendc:
        - references/paradigms/broadcast/adapters/ascendc/example/xdivy_custom_package
    ArgReduce:
      ascendc:
        - references/paradigms/argreduce/adapters/ascendc/example/arg_max_with_value_package
    IndexGather:
      ascendc:
        - references/paradigms/indexgather/adapters/ascendc/example/examples-custom-gather-code
    SlidingWindow:
      ascendc:
        - references/paradigms/conv/forward/adapters/ascendc/example/conv2d
    ScatterUpdate:
      ascendc:
        - references/paradigms/scatterupdate/adapters/ascendc/example/examples-tensor-scatter-nd-update-code
    ConvBackward:
      ascendc:
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3ddx_direct
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3ddx_aclnn
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3dtranspose_direct
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3dtranspose_aclnn
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3ddw_direct
        - references/paradigms/conv/backward/adapters/ascendc/example/conv3ddw_aclnn
