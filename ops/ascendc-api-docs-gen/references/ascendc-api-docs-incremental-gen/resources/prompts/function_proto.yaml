task_content: |
  从证据中提取函数原型相关信息：
  - 函数原型定义（函数名、模板参数、参数名、参数类型、返回值类型、函数限定符）
  - 多个函数原型之间的区别
  - 接口所在的头文件路径
  - 各函数原型支持的硬件型号

