use_target_key: true

task_content: |
  从提供的证据中，完整提取目标函数的参数信息。

  必须遵循的约束：
  1. **穷尽所有重载**：证据中若存在多个同名函数重载（参数类型不同），必须把所有重载中出现过的每一个参数名都覆盖到，不得只选一两个代表性样本。
  2. **每参数一条目**：每个不同的参数名（例如输出参数 dst、输入参数 src/input、控制参数 mask 等）都必须作为独立条目列出，不得遗漏。
  3. **覆盖所有重载类型**：每个参数条目必须列出证据中该参数在所有重载变体里出现过的全部数据类型与名称差异（如某重载里叫 src 而另一重载里叫 input，需一并说明），不得仅取其中部分类型。
  4. **仅限目标函数**：严格只提取目标函数的参数，不要把同一文件中其他无关函数的参数信息（例如 asc_sub、asc_add 等）混入结果。

  模板参数说明（若证据中存在模板参数则必填）：
  | 参数名 | 输入/输出 | 描述 |
  描述中包含：参数含义、默认值、对函数行为的影响

  入参说明：
  | 参数名 | 输入/输出 | 描述 |
  描述中包含：
  - 参数含义和使用场景
  - 参数支持的取值和数据类型（必须覆盖证据中所有重载版本出现的类型，不得只列其中部分）
    1. 对于数值类参数，需要列出单位、取值范围、默认值，支持的数据类型；不同重载的类型差异需完整呈现。
    2. 对于数据结构类参数，需要列出数据结构的定义（结构定义过长可不列出，但需要给出所在头文件目录）并给出详细介绍。
    3. 有特殊含义的参数取值，不要使用"魔鬼数字"，需要增加解释该取值含义的说明。
    4. 参数取值数据类型，区分硬件型号时，需要按照硬件型号分别列出；接口支持的数据类型只和位宽有关，提供位宽表达；
  - 参数配置方法：对于复杂或者具有特殊要求的配置方法，需要提供配置方式的说明
  - 相关参数和API：如果该参数需要和其他API配合使用，需要描述其配合关系；如果和其他API/参数功能类似，需要描述两者间的区别（仅限证据中明确出现的）
  - 参数间的约束和配合关系
  - 特殊值处理（如传空指针场景）

return_fields: |
  "模板参数说明": [{"content": "描述内容", "evidence_id": ["证据ID"]}]
  "入参说明": [{"content": "描述内容", "evidence_id": ["证据ID"]}]
