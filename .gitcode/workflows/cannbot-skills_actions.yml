name: PR-pipeline_cannbot-skills

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^(?:\/)?compile*' ]
  pr_comment:
    types: [ created ]
    keyword: '^(?:\/)?compile*'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_AI_review:
        name: CodeCheck_AI_review
        uses: .gitcode/workflows/check_action.yml
        with:
          task_name: 'AI_review'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_check_opencode }}
          arch: 'arm64'
          package_name: 'pr_check.md'
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: Test
    jobs:
      # 安全门禁先于任何会执行 PR 代码的 UT/ST。这里只运行 Runner 上已部署的
      # 受信任脚本，由 RDV 检出 PR 合并树并执行 Sift 基础扫描。
      JOB_security_vet:
        name: Security_Vet
        steps:
          - name: check_security_vet_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-security-vet.sh \
                || { echo "❌ runner 上未找到 ci-pr-security-vet.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_security_vet
            env:
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-security-vet.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 1800
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      # 第二道静态门禁：SkillSpector 风险分（与 Sift 差分正交）。同样只运行 Runner 上
      # 已部署的受信任脚本，由 RDV 检出合并树并执行纯静态扫描（--no-llm）。
      JOB_skillspector_vet:
        name: Skillspector_Vet
        steps:
          - name: check_skillspector_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-skillspector.sh \
                || { echo "❌ runner 上未找到 ci-pr-skillspector.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_skillspector_vet
            env:
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-skillspector.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 1800
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      # 第三道静态门禁：Bandit Python 扫描（绝对阈值，HIGH 阻断 / MEDIUM 告警）。只扫 PR
      # 改动的 .py 文件；同样只运行 Runner 上已部署的受信任脚本，由 RDV 检出合并树执行。
      JOB_bandit_vet:
        name: Bandit_Vet
        steps:
          - name: check_bandit_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-bandit.sh \
                || { echo "❌ runner 上未找到 ci-pr-bandit.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_bandit_vet
            env:
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-bandit.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 1800
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      JOB_content_critique:
        name: Content_Critique
        steps:
          - name: check_content_critique_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-content-critique.sh \
                || { echo "❌ runner 上未找到 ci-pr-content-critique.sh，请确认 cannbot-skills-rdv 已部署" >&2; exit 3; }
          - name: run_content_critique
            env:
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-content-critique.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 600
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      JOB_ut:
        name: UT_cannbot-skills
        needs: [JOB_security_vet, JOB_skillspector_vet, JOB_bandit_vet]
        uses: .gitcode/workflows/ut_action.yml
        with:
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_st_test:
        name: ST_test
        needs: [JOB_security_vet, JOB_skillspector_vet, JOB_bandit_vet]
        steps:
          - name: check_script
            run: |
              test -f /home/w00617363/cannbot-skills-rdv/scripts/ci-pr-verify.sh \
                || { echo "❌ runner 上未找到 ci-pr-verify.sh，请确认 cannbot-skills-rdv 已部署" >&2; exit 3; }
          - name: run_st_test
            run: |
              bash /home/w00617363/cannbot-skills-rdv/scripts/ci-pr-verify.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --platforms A2 \
                --password "${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 3600 \
                --poll-interval 60 \
                --strict
        if: "${{ default() }}"
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
    pre:
    - type: auto
    fail-fast: false


post:
  jobs: 
    job_post: 
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
