name: PR-pipeline_cannbot-skills

concurrency:
  max: 15
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
    types: [ created ]
    keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  # RDV 报告（md）本地暂存根目录：每个 Job 一个子目录（见各 Job 的 CI_REPORT_DIR）
  ci_report_dir: "/tmp/cannbot-ci-reports/${{ env.MERGE_ID }}"
  st_report_dir: "${{ env.ci_report_dir }}/st/${{ atomgit.run_id }}-${{ atomgit.run_attempt }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              comment: ${{ atomgit.event.comment.body }}
              token: ${{ secrets.TESTTOKEN }}
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        permissions:
          repository: read
          id-token: write
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: Compile
    jobs:
      JOB_AI_review:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck_AI_review
        uses: .gitcode/workflows/check_action.yml
        with:
          task_name: 'AI_review'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test_check_opencode }}
          arch: 'arm64'
          package_name: 'pr_check.md'
      # git-ai 归因检测（信息展示，不拦截合入）：
      # 镜像动态解析（默认映射已含 git_ai 条目，普通 compile 评论即可），零 secret
      JOB_git_ai:
        name: CodeCheck_git_ai
        uses: .gitcode/workflows/git-ai-authorship_action.yml
        with:
          image_version: ${{ jobs.JOB_image.outputs.git_ai }}
          pr_number: ${{ atomgit.event.pull_request.number }}
      JOB_changelog:
        name: Changelog_fragment
        if: "${{ atomgit.event.pull_request.number > 0 }}"
        steps:
          - name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
              allow-unsafe-pr-checkout: true
          - name: check_fragments
            run: |
              set -euo pipefail
              cd ${{ steps.process_checkout.outputs.path }}
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch --unshallow origin
              fi
              git cat-file -e 'HEAD^1^{commit}' && git cat-file -e 'HEAD^2^{commit}'
              BASE_TREE=$(git merge-base HEAD^1 HEAD^2)
              if git cat-file -e "${BASE_TREE}:scripts/changelog.py" 2>/dev/null; then
                # 基线已有机制才启用门禁；策略取可信基线，PR 新规则由其单测验证。
                git show "${BASE_TREE}:scripts/changelog.py" > /tmp/changelog.py
                if git diff --no-renames --name-only "${BASE_TREE}...HEAD^2" -- CHANGELOG.md | grep -q .; then
                  python3 /tmp/changelog.py verify-release --repo . --base "${BASE_TREE}" --head HEAD^2
                else
                  python3 /tmp/changelog.py check --repo . --base "${BASE_TREE}" --head HEAD^2 --pr-number "${MERGE_ID}"
                fi
              else
                echo "存量 PR 或首笔 bootstrap：基线无 fragment 机制，跳过禁改"
              fi
              if [ -f tests/unit/test_changelog.py ]; then
                python3 -m unittest discover -s tests/unit -p 'test_changelog.py' -v
              fi
        runs-on: ['self-hosted', 'arch=x64', 'spec=small']
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_codecheck:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_staticcheck_md_check:
        permissions:
          repository: read
          id-token: write
        name: CodeCheck_staticcheck_md_check
        uses: .gitcode/workflows/staticcheck_action.yml
        with:
          check_type: 'md_check'
          image_version: ${{ jobs.JOB_image.outputs.staticcheck }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: Security_content_Scan
    jobs:
      # 聚合静态门禁：一次请求跑完（Security_Vet / Skillspector_Vet / Bandit_Vet / Semgrep_Vet /Content_Critique
      JOB_static_vet:
        permissions:
          repository: read
          id-token: write
        name: Static_Vet
        steps:
          - name: check_static_vet_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                || { echo "❌ runner 上未找到 ci-pr-vet.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
              # Step Summary 共享库：缺失时摘要与 md 报告落盘会**静默失效**（退出码不变、
              # 日志只有 command not found），所以与主脚本一样前置 fail-closed 拦下。
              test -f /opt/cannbot-skills-rdv/scripts/lib/ci-summary.sh \
                || { echo "❌ runner 上未找到 lib/ci-summary.sh，请先部署 cannbot-skills-rdv" >&2; exit 3; }
          - name: run_static_vet
            env:
              ATOMGIT_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              CI_REPORT_DIR: "${{ env.ci_report_dir }}/static-vet"
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-vet.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 1800
          # 完整 md 报告上传 OBS（`always()`：门禁未通过也上传；`continue-on-error`：上传异常不染红）
          -
            name: oidc_auth
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          - name: upload_static_vet_report
            if: ${{ always() }}
            continue-on-error: true
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: "${{ env.ci_report_dir }}/static-vet/*.md"
              object-prefix: ${{ env.obs_path }}/
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
      JOB_ut:
        permissions:
          repository: read
          id-token: write
        name: UT_cannbot-skills
        uses: .gitcode/workflows/ut_action.yml
        with:
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
    pre:
    - type: auto
    fail-fast: false
  # ST 动态评测单独成 stage，最后执行（stage 串行保证其晚于 stage3 的四道门禁与 UT）。
  stage4:
    name: Skill_Test
    jobs:
      JOB_st_test:
        permissions:
          repository: read
          id-token: write
        name: ST_test
        steps:
          - name: check_script
            run: |
              test -f /opt/cannbot-skills-rdv/scripts/ci-pr-verify.sh \
                || { echo "❌ runner 上未找到 ci-pr-verify.sh，请确认 cannbot-skills-rdv 已部署" >&2; exit 3; }
          - name: run_st_test
            env:
              ATOMGIT_RUN_ATTEMPT: ${{ atomgit.run_attempt }}
              ADMIN_PASSWORD: ${{ secrets.ST_PLATFORM_ADMIN_PASSWORD }}
              CI_REPORT_DIR: ${{ env.st_report_dir }}
            run: |
              bash /opt/cannbot-skills-rdv/scripts/ci-pr-verify.sh \
                --pr-number "${{ env.MERGE_ID }}" \
                --gitcode-repo cann/cannbot-skills \
                --timeout 3600 \
                --poll-interval 60 \
                --strict
          # 仅发布当前尝试生成的报告，ST 失败后仍可认证并上传。
          - name: check_st_report
            identifier: check_st_report
            if: ${{ always() && !canceled() }}
            continue-on-error: true
            env:
              CI_REPORT_DIR: ${{ env.st_report_dir }}
            run: |
              for report in "$CI_REPORT_DIR"/*.md; do
                if [ -f "$report" ] && [ -s "$report" ]; then
                  printf 'present=true\n' >> "$ATOMGIT_OUTPUT"
                  break
                fi
              done
          -
            name: oidc_auth
            identifier: st_report_oidc
            if: ${{ always() && !canceled() && steps.check_st_report.outputs.present == 'true' }}
            continue-on-error: true
            uses: huaweicloud-oidc-auth
            with:
              audience: ${{ secrets.audience }}
              agency_urn: ${{ secrets.agency_urn }}
              provider_urn: ${{ secrets.provider_urn }}
              region: cn-north-4
              duration: 3600
          - name: upload_st_report
            if: ${{ always() && !canceled() && steps.st_report_oidc.outcome == 'success' }}
            continue-on-error: true
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              artifact-path: "${{ env.st_report_dir }}/*.md"
              object-prefix: ${{ env.obs_path }}/
        if: "${{ default() }}"
        runs-on:
          - self-hosted
          - runner_name=A5_skill_tester_02
    pre:
    - type: auto
    fail-fast: false


post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
