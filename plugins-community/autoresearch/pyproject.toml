[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "op-autoresearch"
version = "0.1.0"
description = "Standalone agent-driven operator kernel optimization workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE-APACHE"}
dependencies = [
  "httpx>=0.24",
  "jinja2>=3.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
worker = [
  "fastapi>=0.100",
  "python-multipart>=0.0.6",
  "uvicorn>=0.23",
]
test = ["pytest>=7.4"]

[project.scripts]
op-autoresearch = "op_autoresearch.cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"op_autoresearch.op.config" = ["*.yaml"]
"op_autoresearch.op.resources" = [
  "templates/*.j2",
  "utils/*.py",
  "docs/**/*.md",
  "docs/**/*.json",
]
"op_autoresearch.op.cann_correctness" = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "level0: fast, hardware-independent gate",
]
