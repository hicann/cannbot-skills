# Default configuration for install-helper
repository:
  url: "https://gitcode.com/cann/cannbot-skills.git"
  name: "cannbot-skills"

scanDirs:
  - ops
  - model
  - graph
  - infra
  - runtime
  - tools

# install-helper 当前仅适配官方插件；社区插件迭代较快暂不纳入，
# 待稳定后在下方 pluginDirs 恢复 plugins-community 即可。
pluginDirs:
  - plugins-official

scanCacheTtlHours: 24

# cannbot 仓（https://gitcode.com/cann/cannbot）插件的安装器托管配置。
# install-helper 以委托转发方式安装 cannbot 型插件：按通道将
# @cannbot-plugin/cannbot 安装到 ~/.cannbot/installers/cannbot，
# 超过 ttlHours 后自动按通道刷新。
cannbotInstaller:
  package: "@cannbot-plugin/cannbot"
  channel: "latest"
  ttlHours: 24
