# Remote NPU targets configuration.
# Copy to project root as .npus.yaml, then add it to your local git ignore
# rules (e.g. .git/info/exclude, or .gitignore if you want it project-wide).

remotes:
  a2:
    backend: docker              # docker: SSH + docker exec
    host: lite0                  # SSH alias from ~/.ssh/config
    container: xc-dev            # Docker container name
    workdir: /workspace           # Parent dir (repo name auto-appended, same as hdspace)
    soc: ascend910b
    device_isolate: 7            # ASCEND_RT_VISIBLE_DEVICES (shared server)

  a3:
    backend: hdspace             # hdspace: tunnel + SSH
    name: DevHW                  # hdspace container name (hdspace devenv list)
    workdir: /mnt/workspace      # Persistent path
    soc: ascend910_93
    login_shell: true            # Required for CANN buildtools
    port: 10022                  # Overrides ~/.devenv/.ssh/config Port (unreliable after tunnel restart)

default: a2
