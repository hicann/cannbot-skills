# Code Performance Advisor - Path Configuration
# Paths may be relative (to the skill root) or absolute.

workspace:
  # Skill-internal working directory (inputs/sessions/cache live underneath).
  base: workspace

external:
  # CAKE2 project root, relative to the skill root skills/code-performance-advisor/.
  # Two levels up: skills/code-performance-advisor/ -> skills/ -> <project-root>/
  # <project-root> is the directory that contains output/ and skills/.
  cake2_root: "../../"
  # Build output directory template (fallback; PathManager auto-detects first).
  build_output: "output/{op_name}"

defaults:
  # Auto-create directories when a path does not exist.
  auto_create_dirs: true
