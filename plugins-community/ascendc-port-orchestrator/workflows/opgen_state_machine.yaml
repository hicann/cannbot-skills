# /ascendc-op-gen workflow state machine — canonical spec
#
# Read by engine/src/scripts/workflow/workflow_critic.py.
# Any change here MUST be mirrored in the affected customer entry Skill under
# skills/{ascendc-cross-gen-port,ascendc-backward-gen}/
# (pre-commit hook enforces the bidirectional drift check).
#
# This YAML encodes what MUST and MUST NOT happen at each workflow phase.
# The critic reads it and rejects phase transitions that violate invariants.
#
# The file's authority: if SKILL.md prose disagrees with this YAML, the YAML wins
#
# Security note (2026-05-12): no Discord/Slack/external channel IDs or bot
# snowflakes ever appear in this YAML or in SKILL.md prose. Such IDs are
# local-only (see CLAUDE.md "Discord IDs are LOCAL-ONLY"). Workflow spec
# stays role-only: "user-direct channel", "DS-collab group channel", etc.
# at critic-runtime.
#
# Invocation: use src/scripts/orch (sets PYTHONPATH=src/scripts) — the single
# correct entry point for python3 -m orchestrator. See SKILL.md §Env setup.
#
# A human PR that changes an entry SKILL.md without updating YAML is blocked by
# the sync-check hook. A human PR that changes YAML without updating at least
# one affected entry SKILL.md is also blocked. This two-way binding prevents
# drift.

version: 1
schema_version: "1.0"
workflow_name: ascendc-op-gen
last_updated: "2026-07-30"

