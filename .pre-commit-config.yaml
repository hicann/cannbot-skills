minimum_pre_commit_version: 4.0.0
exclude: ^third_party/|\.(html|csv|svg)$

default_stages: [pre-commit]
ci:
  autofix_prs: false
  autoupdate_schedule: monthly

repos:
  # pre-commit 基础检查
  - repo: https://gitcode.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # md 保留行尾双空格（markdown 硬换行语法），其余尾随空白照删
        args: ["--markdown-linebreak-ext=md"]
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        # eval 数据集（reviewer_bench 等）合法大文件，新增 jsonl 不拦截
        exclude: \.jsonl$
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-json
        # tsconfig*/settings.json 属 JSONC（允许注释），非严格 JSON
        exclude: (^|/)tsconfig(\.[a-z]+)?\.json$|(^|/)\.claude/settings\.json$|(^|/)example_add\.json$

  # C++ 代码格式化检查
  - repo: https://gitcode.com/pre-commit-clang/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc|hh|cxx|hxx|asc)$
        args:
          - "--style=file"
          - "--verbose"
          - "-i"
        # kb/ 为从 CANN 仓提取的知识库快照，重排会与提取源漂移
        exclude: (^|/)kb/

  # Python 代码检查
  - repo: https://gitcode.com/gh_mirrors/ru/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff-check
        args: ["--output-format", "github", "--fix", "--ignore", "E501,RUF001,RUF002,RUF003,E402,E701,E702,N815"]
        types: [python]
      - id: ruff-format
        types: [python]

  # 拼写检查
  - repo: https://gitcode.com/gh_mirrors/co/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # 包装 entry：输出 tee 到 pre-commit_reports/codespell.log（仍跑在托管 venv）
        entry: bash scripts/run_codespell.sh
        args: [
            "-L",
            "CANN,cann,NNAL,nnal,ASCEND,ascend,EnQue,CopyIn,ArchType,AND,ND,nd,te,tbe,copyin,alog,wIh,dout,indexs,inH,padD,outWeight,vor,invokable,VALU,LastR,nin,COO,registe,CLen,REGIST,fo,subtile,rIn,IndexT,ot,iput,datas,allOne,ist,clos",
            "--skip",
            "*.cc,*.cjs,*.clang-format,*.cmake,*.cpp,*.csv,*.cts,*.gitignore,*.gitkeep,*.gitmodules,*.h,*.hpp,*.in,*.info,*.ini,*.js,*.json,*.jsonl,*.log,*.py,*.sh,*.TAG,*.ts,*.tsx,*.txt,*.xml",
          ]
        # kb/ 为提取快照，不检
        exclude: (^|/)kb/

  # OAT 合规性检查 (Open Source Audit Tool)
  - repo: local
    hooks:
      - id: oat-check
        name: OAT Compliance Check
        entry: bash scripts/oat_check.sh
        language: system
        require_serial: true
        pass_filenames: true
        types: [file]
        stages: [pre-commit]
        verbose: true
